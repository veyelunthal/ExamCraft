<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ExamCraft | Question Bank</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="questions">
<header class="topbar"><div class="brand"><span class="brand-mark">EC</span><div><b>ExamCraft</b><small>Randomized Assessment System</small></div></div><nav><a href="index.html">Dashboard</a><a class="active" href="questions.html">Question Bank</a><a href="generate.html">Generate Paper</a><a href="attempt.html">Take Test</a><a href="usage.html">Usage</a></nav></header>
<main class="container"><div class="page-heading"><div><p class="eyebrow">QUESTION BANK</p><h1>Manage questions</h1><p>Add and tag questions before generating papers.</p></div></div><div id="message"></div>
<section class="two-col"><div class="panel"><div class="panel-head"><h2>Create Unit</h2><span class="tag">UNIT</span></div><form id="unitForm"><label>Unit name<input id="unitName" required placeholder="e.g. Unit 1 - Java Basics"></label><label>Description<textarea id="unitDescription" placeholder="Short unit description"></textarea></label><button class="btn primary" type="submit">Add Unit</button></form></div>
<div class="panel"><div class="panel-head"><h2>Add Question</h2><span class="tag">QUESTION</span></div><form id="questionForm" class="form-grid"><label class="full">Question<textarea id="questionText" required placeholder="Enter the question"></textarea></label><label>Unit<select id="questionUnit" required></select></label><label>Topic<input id="topic" required placeholder="e.g. OOP"></label><label>Difficulty<select id="difficulty"><option value="EASY">Easy</option><option value="MEDIUM">Medium</option><option value="HARD">Hard</option></select></label><label>Type<select id="questionType"><option value="MCQ">MCQ</option><option value="TRUE_FALSE">True / False</option></select></label><label>Option A<input id="optionA" placeholder="Option A"></label><label>Option B<input id="optionB" placeholder="Option B"></label><label>Option C<input id="optionC" placeholder="Option C"></label><label>Option D<input id="optionD" placeholder="Option D"></label><label>Correct answer<input id="correctAnswer" required placeholder="MCQ: A/B/C/D | T/F: TRUE/FALSE"></label><div class="full"><button class="btn primary" type="submit">Save Question</button></div></form></div></section>
<section class="panel"><div class="panel-head"><h2>Question Bank</h2><span id="questionTotal" class="tag">0 QUESTIONS</span></div><div class="table-wrap"><table><thead><tr><th>Question</th><th>Unit</th><th>Topic</th><th>Difficulty</th><th>Type</th><th>Usage</th><th></th></tr></thead><tbody id="questionTable"></tbody></table></div></section></main><script src="js/app.js"></script></body></html>
