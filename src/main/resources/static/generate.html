<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ExamCraft | Generate Paper</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="generate">
<header class="topbar"><div class="brand"><span class="brand-mark">EC</span><div><b>ExamCraft</b><small>Randomized Assessment System</small></div></div><nav><a href="index.html">Dashboard</a><a href="questions.html">Question Bank</a><a class="active" href="generate.html">Generate Paper</a><a href="attempt.html">Take Test</a><a href="usage.html">Usage</a></nav></header>
<main class="container"><div class="page-heading"><div><p class="eyebrow">TEST GENERATOR</p><h1>Generate a randomized paper</h1><p>The service follows your requested difficulty mix as closely as the available question bank allows.</p></div></div><div id="message"></div>
<section class="panel generator"><form id="generateForm" class="form-grid"><label>Paper title<input id="paperTitle" placeholder="Java Internal Assessment"></label><label>Total questions<input id="totalQuestions" type="number" min="1" value="10" required></label><label>Unit (optional)<select id="paperUnit"><option value="">All units</option></select></label><label>Easy %<input id="easyPercent" type="number" min="0" max="100" value="40" required></label><label>Medium %<input id="mediumPercent" type="number" min="0" max="100" value="30" required></label><label>Hard %<input id="hardPercent" type="number" min="0" max="100" value="30" required></label><div class="full mix-preview"><span>Distribution must total 100%</span><strong id="mixTotal">100%</strong></div><div class="full"><button class="btn primary" type="submit">Generate Random Paper</button></div></form></section>
<section id="paperResult" class="panel hidden"></section></main><script src="js/app.js"></script></body></html>
